<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIEM Console{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="ph-fill ph-shield-check"></i>
                    <span>DERE</span>
                </div>
                <button class="icon-btn mobile-close" id="sidebar-close">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="{% url 'dashboard' %}"
                            class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                            <i class="ph ph-squares-four"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'events' %}"
                            class="{% if request.resolver_match.url_name == 'events' %}active{% endif %}">
                            <i class="ph ph-list-dashes"></i>
                            <span>Events</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'alerts' %}"
                            class="{% if request.resolver_match.url_name == 'alerts' %}active{% endif %}">
                            <i class="ph ph-bell"></i>
                            <span>Alerts</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'assets' %}"
                            class="{% if request.resolver_match.url_name == 'assets' %}active{% endif %}">
                            <i class="ph ph-desktop"></i>
                            <span>Assets</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'investigations' %}"
                            class="{% if request.resolver_match.url_name == 'investigations' %}active{% endif %}">
                            <i class="ph ph-magnifying-glass"></i>
                            <span>Investigations</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'logs' %}"
                            class="{% if request.resolver_match.url_name == 'logs' %}active{% endif %}">
                            <i class="ph ph-file-text"></i>
                            <span>Logs</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'hunting' %}"
                            class="{% if request.resolver_match.url_name == 'hunting' %}active{% endif %}">
                            <i class="ph ph-crosshair"></i>
                            <span>Hunting</span>
                        </a>
                    </li>
                </ul>

                <div class="nav-divider"></div>

                <ul>
                    <li>
                        <a href="{% url 'settings' %}"
                            class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                            <i class="ph ph-gear"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">A</div>
                    <div class="user-info">
                        <span class="name">Analyst</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="top-bar">
                <button class="icon-btn mobile-menu" id="sidebar-toggle">
                    <i class="ph ph-list"></i>
                </button>
                <div class="breadcrumbs">
                    <span class="crumb-root">Console</span>
                    <i class="ph ph-caret-right"></i>
                    <span class="crumb-current">{% block page_title %}Dashboard{% endblock %}</span>
                </div>
                <div class="top-actions">
                    <button class="icon-btn"><i class="ph ph-bell"></i></button>
                    <button class="icon-btn"><i class="ph ph-question"></i></button>
                </div>
            </header>

            <main class="page-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        // Simple sidebar toggle for mobile
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const closeBtn = document.getElementById('sidebar-close');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
        });

        closeBtn.addEventListener('click', () => {
            sidebar.classList.remove('open');
        });

        // Top Bar Interactions
        const bellBtn = document.querySelector('.top-actions .icon-btn:first-child');
        const helpBtn = document.querySelector('.top-actions .icon-btn:last-child');

        bellBtn.addEventListener('click', () => {
            alert('No new notifications.');
        });

        helpBtn.addEventListener('click', () => {
            alert('Help & Documentation:\n\n1. Use the sidebar to navigate.\n2. Dashboard shows overview metrics.\n3. Events/Alerts show security data.\n4. Hunting allows running queries.\n5. Settings allows configuration.');
        });
    </script>
</body>

</html>
